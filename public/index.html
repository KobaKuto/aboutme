<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KobaKuto Timeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one column; each day is a row; one post fills the row, more posts on the same day slide in from the right (+N / wheel) */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --fg:#16191E; --muted:#68707B; --line:#E0E3E8; --accent:#C93A55; --shadow:rgba(22,25,30,.10);
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
/* 中国語・韓国語の文言を日本語の字形で出さないため */
:root:lang(ko){--f-body:"Noto Sans KR","IBM Plex Sans JP",sans-serif}
:root:lang(zh-TW){--f-body:"Noto Sans TC","IBM Plex Sans JP",sans-serif}
:root:lang(zh-CN){--f-body:"Noto Sans SC","IBM Plex Sans JP",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#171A1F; --fg:#E7E9EC; --muted:#99A1AC; --line:#2A2E35; --accent:#EE6680; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216; --surface:#171A1F; --fg:#E7E9EC; --muted:#99A1AC; --line:#2A2E35; --accent:#EE6680; --shadow:rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

header{display:flex;flex-direction:column;gap:6px;position:relative;padding-right:152px}
.controls{position:absolute;top:0;right:0;display:flex;align-items:center;gap:8px}
.theme{appearance:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.lang{height:36px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);font:inherit;font-size:13px;padding:0 10px;cursor:pointer}
.theme:hover,.lang:hover{border-color:var(--fg)}
.theme:focus-visible,.lang:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
h1{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.links-top{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.links-top a{color:var(--muted);text-decoration:none}
.links-top a:hover{color:var(--fg)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:20px;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 0;cursor:pointer;position:relative}
.tab[aria-selected="true"]{color:var(--fg);font-weight:500}
.tab[aria-selected="true"]::after{content:"";position:absolute;inset:auto 0 -1px;height:2px;background:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.days{list-style:none;margin:0;padding:0 0 0 26px;display:flex;flex-direction:column;gap:24px;position:relative}
.days:not(.is-empty)::before{content:"";position:absolute;left:6px;top:10px;bottom:0;width:2px;border-radius:2px;background:var(--line)}
.days.is-empty{padding-left:0}
.day{display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.day::before{content:"";position:absolute;left:-26px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--muted)}
.day::after{content:"";position:absolute;left:-12px;top:11px;width:8px;height:2px;background:var(--line)}
.day.has-work::before{border-color:var(--accent);background:var(--accent)}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 投稿1つで幅を埋める。複数ある日は横に並び、右の+Nとホイールで送る（スクロールバーは出さない） */
.rowwrap{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:center;gap:6px}
/* 行の縦の枠は常に「ラベル＋本文1行＋16:9の画像1枚＋リンク」ぶんで固定。文章量や画像の有無で変わらない
   （46 = 右の+N列と隙間、30 = カード左右の padding と枠線、130 = 上下の padding・枠線と画像以外の行・隙間、18 = 行の上下 padding） */
.rowwrap{container-type:inline-size;--slot:calc((100cqw - 46px - 30px) * 9 / 16 + 130px)}
.row{height:calc(var(--slot) + 18px);display:flex;align-items:flex-start;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:6px 12px;margin-block:-6px -12px}
.row::-webkit-scrollbar{display:none}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}
.post{flex:0 0 100%;min-width:0;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;
  /* カードは中身に合わせた高さ。行の枠（上記 --slot）を超えるぶんは本文が切れる */
  max-height:var(--slot);overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.post:hover{border-color:var(--muted);box-shadow:0 8px 18px -12px var(--shadow)}
@media (prefers-reduced-motion:no-preference){.post:hover{transform:translateY(-3px)}}
.more{justify-self:center;appearance:none;border:0;cursor:pointer;font-family:var(--f-mono);font-size:12px;line-height:1;min-width:34px;padding:7px 8px;border-radius:999px;background:var(--accent);color:var(--surface);transition:transform .15s ease}
.more:hover{transform:scale(1.08)}
.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more.back{background:var(--line);color:var(--fg)}
.kind{font-size:11px;color:var(--muted)}
.post.work .kind{color:var(--accent)}
.text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;min-height:0;overflow:hidden}
.thumb{flex:none;display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--line)}
.out{flex:none;display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.out a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.out a:hover{text-decoration-color:var(--fg)}
.empty{color:var(--muted);text-align:center;padding:32px 0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="controls">
      <select class="lang" id="lang"></select>
      <button class="theme" id="theme" type="button">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="none"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <h1>KobaKuto</h1>
    <nav class="links-top" aria-label="SNS" id="sns"></nav>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>
  <ul class="days" id="days"></ul>
</div>

<script>
const CONFIG = {
  csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTc6RtO2MeSIrh6S9ei32kBM5XVwzsZRWrDhnR-T3VKkOjX9R_MHIjBLhrky6b01RpY6wpCw3dTMkj6/pub?output=csv",
  cacheKey: "csv",
  defaultLang: "ja",
  sns: [["X","https://x.com/koba_kova"],["YouTube","https://www.youtube.com/"],["Bilibili","https://www.bilibili.com/"],["nico","https://www.nicovideo.jp/"],["Pixiv","https://www.pixiv.net/"]],
};
const LANGS = [["ja","日本語"],["ko","한국어"],["en","English"],["zh-TW","繁體中文"],["zh-CN","简体中文"]];
const I18N = {
  ja:      {tabAll:"すべて", tabWorks:"創作", tabPosts:"ポスト", empty:"まだ投稿がありません", loadError:"投稿を読み込めませんでした", otherLink:"作品ページ", next:"次の投稿へ（残り{n}件）", back:"最初の投稿に戻る", theme:"ライト／ダーク切り替え", language:"言語"},
  ko:      {tabAll:"전체", tabWorks:"창작", tabPosts:"포스트", empty:"아직 게시물이 없습니다", loadError:"게시물을 불러오지 못했습니다", otherLink:"작품 페이지", next:"다음 게시물 (남은 {n}건)", back:"첫 게시물로", theme:"라이트/다크 전환", language:"언어"},
  en:      {tabAll:"All", tabWorks:"Works", tabPosts:"Posts", empty:"No posts yet", loadError:"Couldn't load posts", otherLink:"Work page", next:"Next post ({n} left)", back:"Back to first post", theme:"Toggle light/dark", language:"Language"},
  "zh-TW": {tabAll:"全部", tabWorks:"創作", tabPosts:"貼文", empty:"還沒有貼文", loadError:"無法載入貼文", otherLink:"作品頁面", next:"下一則（還有 {n} 則）", back:"回到第一則", theme:"切換淺色／深色", language:"語言"},
  "zh-CN": {tabAll:"全部", tabWorks:"创作", tabPosts:"帖子", empty:"还没有帖子", loadError:"无法加载帖子", otherLink:"作品页面", next:"下一条（还有 {n} 条）", back:"回到第一条", theme:"切换浅色／深色", language:"语言"},
};
const TABS = [["all","tabAll",null],["works","tabWorks","創作"],["posts","tabPosts","ポスト"]];
const LINK_COLS = [["youtube","YouTube"],["bilibili","Bilibili"],["nico","nico"],["x","X"],["pixiv","Pixiv"]];
const SHOPS = {"booth.pm":"BOOTH","dlsite.com":"DLsite","melonbooks.co.jp":"メロンブックス","toranoana.jp":"とらのあな","fanbox.cc":"FANBOX"};

const root = document.documentElement;
const tabsEl = document.getElementById("tabs"), daysEl = document.getElementById("days");
const langEl = document.getElementById("lang"), themeEl = document.getElementById("theme"), snsEl = document.getElementById("sns");
// localStorage はプライベートモード等で例外になるので、使えなければ保存しないだけにする
const store = {
  get: k => { try { return localStorage.getItem(k); } catch(e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} },
};
let lang = CONFIG.defaultLang, rows = null, failed = false;
const t = k => I18N[lang][k];
const siteName = n => n === "nico" ? (lang === "ja" ? "ニコニコ" : "Niconico") : n;

function parseCsv(src){
  src = src.replace(/^﻿/, "").replace(/\r\n?/g, "\n");
  const table = [[]];
  let cell = "", quoted = false;
  for (let i = 0; i < src.length; i++){
    const c = src[i];
    if (quoted){
      if (c === '"' && src[i + 1] === '"'){ cell += '"'; i++; }
      else if (c === '"') quoted = false;
      else cell += c;
    }
    else if (c === '"') quoted = true;
    else if (c === ","){ table.at(-1).push(cell); cell = ""; }
    else if (c === "\n"){ table.at(-1).push(cell); cell = ""; table.push([]); }
    else cell += c;
  }
  table.at(-1).push(cell);
  const [head, ...body] = table;
  const keys = head.map(h => h.trim());
  return body.map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] || "").trim()])));
}

async function load(){
  const cached = store.get(CONFIG.cacheKey);
  if (cached) show(cached);
  try {
    const res = await fetch(CONFIG.csvUrl);
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    if (text === cached) return;
    store.set(CONFIG.cacheKey, text);
    show(text);
  } catch(e) {
    if (!cached){ failed = true; render(); }
  }
}
function show(text){ rows = parseCsv(text).filter(r => r.date); render(); }

function thumbOf(r){
  if (r.image) return r.image;
  const id = (r.youtube || "").match(/(?:[?&]v=|youtu\.be\/|\/shorts\/)([\w-]+)/)?.[1];
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : "";
}
function shopName(url){
  let host = "";
  try { host = new URL(url).hostname; } catch(e) {}
  const hit = Object.keys(SHOPS).find(d => host === d || host.endsWith("." + d));
  return hit ? SHOPS[hit] : t("otherLink");
}
// other 列は1行1リンク。「表示名 URL」は最後の半角スペース以降を URL とみなす
function otherLinks(cell){
  return cell.split("\n").map(s => s.trim()).flatMap(line => {
    const i = line.lastIndexOf(" "), url = line.slice(i + 1), name = i < 0 ? "" : line.slice(0, i).trim();
    return url.startsWith("http") ? [[name || shopName(url), url]] : [];
  });
}
function linksOf(r){
  const fixed = LINK_COLS.filter(([k]) => (r[k] || "").startsWith("http")).map(([k, n]) => [siteName(n), r[k]]);
  return [...fixed, ...otherLinks(r.other || "")];
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function postEl(r){
  const work = r.type === "創作";
  const card = el("article", "post" + (work ? " work" : ""));
  card.append(el("span", "kind", t(work ? "tabWorks" : "tabPosts")), el("p", "text", r.text));
  const src = thumbOf(r);
  if (src){ const img = el("img", "thumb"); img.src = src; img.alt = ""; img.loading = "lazy"; card.append(img); }
  const links = linksOf(r);
  if (links.length){
    const out = el("div", "out");
    links.forEach(([n, u]) => { const a = el("a", null, n); a.href = u; out.append(a); });
    card.append(out);
  }
  return card;
}
function dayEl(date, posts){
  const li = el("li", "day" + (posts.some(p => p.type === "創作") ? " has-work" : ""));
  const wrap = el("div", "rowwrap"), row = el("div", "row");
  row.append(...posts.map(postEl));
  wrap.append(row);
  if (posts.length > 1){
    row.classList.add("multi");
    row.tabIndex = 0;
    row.setAttribute("aria-label", `${date} (${posts.length})`);
    wrap.append(el("button", "more"));
    wrap.lastChild.type = "button";
  }
  li.append(el("span", "date", date.replaceAll("-", ".")), wrap);
  return li;
}
function render(){
  const tab = TABS.find(x => x[0] === location.hash.slice(1)) || TABS[0];
  tabsEl.innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" id="tab-${k}" data-k="${k}" aria-selected="${k === tab[0]}">${t(l)}</button>`).join("");
  if (!rows && !failed) return;
  const byDay = {};
  (rows || []).filter(r => !tab[2] || r.type === tab[2]).forEach(r => (byDay[r.date] ||= []).unshift(r)); // 同じ日の中は行の逆順＝新しい投稿が左
  const dates = Object.keys(byDay).sort().reverse();
  daysEl.replaceChildren(...(dates.length ? dates.map(d => dayEl(d, byDay[d])) : [el("li", "empty", t(failed ? "loadError" : "empty"))]));
  daysEl.classList.toggle("is-empty", !dates.length);
  daysEl.querySelectorAll(".row.multi").forEach(setupRow);
}

// 横並びの日：今いる位置・右の+N・ホイールでの送り
const pos = row => {
  if (row.scrollLeft >= row.scrollWidth - row.clientWidth - 1) return row.children.length - 1;
  return Math.round(row.scrollLeft / (row.firstElementChild.offsetWidth + 10));
};
// scrollTo の smooth は環境（OSのアニメーション設定など）で一瞬になるので自前で動かす。動かす間だけ snap を外す
const anim = new WeakMap();
function goTo(row, i){
  cancelAnimationFrame(anim.get(row));
  const from = row.scrollLeft;
  const to = Math.min(row.children[i].offsetLeft - row.firstElementChild.offsetLeft, row.scrollWidth - row.clientWidth);
  const t0 = performance.now(), dur = 380;
  row.style.scrollSnapType = "none";
  const step = now => {
    const t = Math.min((now - t0) / dur, 1);
    row.scrollLeft = from + (to - from) * (1 - Math.pow(1 - t, 3));
    if (t < 1) anim.set(row, requestAnimationFrame(step));
    else row.style.scrollSnapType = "";
  };
  anim.set(row, requestAnimationFrame(step));
}
function updateBadge(row){
  const btn = row.nextElementSibling, left = row.children.length - 1 - pos(row);
  btn.classList.toggle("back", left === 0);
  btn.textContent = left ? `+${left}` : "↩";
  btn.setAttribute("aria-label", left ? t("next").replace("{n}", left) : t("back"));
}
function setupRow(row){
  const btn = row.nextElementSibling;
  let lock = false;
  updateBadge(row);
  row.addEventListener("scroll", () => updateBadge(row), {passive: true});
  btn.addEventListener("click", () => { const i = pos(row) + 1; goTo(row, i < row.children.length ? i : 0); });
  // 縦ホイールを横送りに変える。端まで来たらページのスクロールに戻す
  row.addEventListener("wheel", e => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const next = pos(row) + Math.sign(e.deltaY);
    if (next < 0 || next >= row.children.length) return;
    e.preventDefault();
    if (lock) return;
    lock = true; setTimeout(() => lock = false, 450);
    goTo(row, next);
  }, {passive: false});
}
tabsEl.addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;const k=b.dataset.k;if(k==="all")history.replaceState(null,"",location.pathname+location.search);else location.hash=k;render()});
window.addEventListener("hashchange",render);

// 言語：ブラウザの言語 → 保存した選択 → URL 指定の順で優先度が上がる
function matchLang(tag){
  const l = (tag || "").toLowerCase();
  if (l.startsWith("zh")) return /tw|hk|mo|hant/.test(l) ? "zh-TW" : "zh-CN";
  return LANGS.find(([k]) => k === l.split("-")[0])?.[0] || null;
}
function pickLang(){
  const candidates = [new URLSearchParams(location.search).get("lang"), store.get("lang"), ...(navigator.languages || [])];
  return candidates.map(matchLang).find(Boolean) || CONFIG.defaultLang;
}
function applyLang(l){
  lang = l;
  root.lang = l;
  langEl.value = l;
  langEl.setAttribute("aria-label", t("language"));
  themeEl.setAttribute("aria-label", t("theme"));
  snsEl.replaceChildren(...CONFIG.sns.map(([n, u]) => { const a = el("a", null, siteName(n)); a.href = u; return a; }));
  render();
}
langEl.append(...LANGS.map(([k, n]) => { const o = el("option", null, n); o.value = k; return o; }));
langEl.addEventListener("change", () => {
  store.set("lang", langEl.value);
  const q = new URLSearchParams(location.search);
  if (q.has("lang")){ q.set("lang", langEl.value); history.replaceState(null, "", `${location.pathname}?${q}${location.hash}`); }
  applyLang(langEl.value);
});

function currentTheme(){
  const t = root.getAttribute("data-theme");
  if (t === "light" || t === "dark") return t;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t){ root.setAttribute("data-theme", t); }
const savedTheme = store.get("theme");
applyTheme(savedTheme === "light" || savedTheme === "dark" ? savedTheme : currentTheme());
themeEl.addEventListener("click",()=>{
  const next = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  store.set("theme", next);
});

applyLang(pickLang());
load();
</script>
</body>
</html>
